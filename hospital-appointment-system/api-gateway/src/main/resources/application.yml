# =============================================================================
# API Gateway - Application Configuration
# =============================================================================
# Central entry point for all client requests. Routes to downstream services
# after JWT validation. Runs on port 8080.
# =============================================================================

server:
  port: 8080

# --- Spring Application ---
spring:
  application:
    name: api-gateway

    # --- Gateway Route Configuration ---
    # Maps logical service names to their actual URLs for request proxying


  cloud:
      gateway:
        services:
          auth-service: http://localhost:8084
          appointment-service: http://localhost:8081
          doctor-service: http://localhost:8082
          notification-service: http://localhost:8083

        routes:

          # Auth Service
          - id: auth-service
            uri: http://localhost:8084
            predicates:
              - Path=/auth/**

          # Appointment Service
          - id: appointment-service
            uri: http://localhost:8081
            predicates:
              - Path=/appointments/**

          # Doctor Service
          - id: doctor-service
            uri: http://localhost:8082
            predicates:
              - Path=/doctors/**

          # Notification Service
          - id: notification-service
            uri: http://localhost:8083
            predicates:
              - Path=/notifications/**

# --- JWT Configuration ---
# Shared secret and expiration across all microservices for consistent token validation
jwt:
  secret: JWT
  expiration: 86400000  # 24 hours in milliseconds



# --- Actuator / Management Endpoints ---
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

# --- Logging Configuration ---
logging:
  level:
    root: INFO
    com.hospital.gateway: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
