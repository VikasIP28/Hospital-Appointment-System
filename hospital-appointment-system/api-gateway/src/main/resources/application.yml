# =============================================================================
# API Gateway - Application Configuration
# =============================================================================
# Central entry point for all client requests. Routes to downstream services
# after JWT validation. Runs on port 8080.
# =============================================================================

server:
  port: 8080

# --- Spring Application ---
spring:
  application:
    name: api-gateway

    # --- Gateway Route Configuration ---
    # Maps logical service names to their actual URLs for request proxying


  cloud:
      gateway:
        services:
          auth-service: http://localhost:8084
          appointment-service: http://localhost:8081
          doctor-service: http://localhost:8082
          notification-service: http://localhost:8083

        routes:
          # Auth Service
          - id: auth-service
            uri: http://localhost:8084
            predicates:
              - Path=/api/auth/**
            filters:
              - RewritePath=/api/(?<segment>.*), /$\{segment}

          # Appointment Service
          - id: appointment-service
            uri: http://localhost:8081
            predicates:
              - Path=/api/appointments/**, /api/admin/system/**, /api/admin/kafka/**
            filters:
              - RewritePath=/api/(?<segment>.*), /$\{segment}

          # Doctor Service
          - id: doctor-service
            uri: http://localhost:8082
            predicates:
              - Path=/api/doctors/**, /api/admin/analytics/doctors
            filters:
              - RewritePath=/api/(?<segment>.*), /$\{segment}

          # Notification Service
          - id: notification-service
            uri: http://localhost:8083
            predicates:
              - Path=/api/notifications/**, /api/admin/notifications/**
            filters:
              - RewritePath=/api/(?<segment>.*), /$\{segment}

# --- JWT Configuration ---
# Shared secret and expiration across all microservices for consistent token validation
jwt:
  secret: 9a4f2c8d3b7a1e5f8g9h0i1j2k3l4m5n6o7p8q9r0s1t2u3v4w5x6y7z8a9b0c1d2e3f4g5h6i7j8k9l0m1n2o3p4q5r6s7t8u9v0w1x2y3z4a5b6c7d8e9f0
  expiration: 86400000  # 24 hours in milliseconds



# --- Actuator / Management Endpoints ---
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

# --- Logging Configuration ---
logging:
  level:
    root: INFO
    com.hospital.gateway: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
